<svg xmlns="http://www.w3.org/2000/svg" width="860" height="404" viewBox="0 0 860 404" role="img" aria-labelledby="t d">
  <title id="t">ashwani@dubai — terminal</title>
  <desc id="d">Ashwani Jha, Senior Software Engineer in Dubai: distributed systems at scale, now building AI agent infrastructure. Experience: PropertyFinder, Senior Software Engineer; Amazon Just Walk Out, SDE II, led 10 engineers (2022–2025); Amazon Pay, SDE (2021–2022); AWS CloudFormation, Cloud Infrastructure Engineer (2019–2021). Impact: AI root-cause agent cut time to root cause from 3 days to 1 hour; store anomaly detection cut cost 40%; Amazon Pay transaction failures down 40%. AI suggestions rejected: many.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .bar  { fill: #161b22; }
    .bg   { fill: #0d1117; }
    .ttl  { fill: #8b949e; font-size: 12.5px; }
    .p    { fill: #7ee787; }
    .c    { fill: #e6edf3; }
    .dim  { fill: #8b949e; }
    .acc  { fill: #b4a7ff; }
    .key  { fill: #79c0ff; }
    .ray  { fill: #d97757; }
    .tag  { fill: #d97757; font-size: 13px; }
    .tagv { fill: #e6edf3; font-size: 13px; font-weight: 600; }
    .cur  { fill: #e6edf3; animation: blink 1.05s steps(1, end) infinite; }
    .spin  { transform-origin: 0 0; animation: spin 24s linear infinite; }
    .pulse { transform-origin: 0 0; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.86); } }
    @media (prefers-reduced-motion: reduce) { .cur, .spin, .pulse { animation: none; } }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="859" height="403" rx="10" class="bg" stroke="#30363d"/>
  <path d="M10.5 0.5 H849.5 a10 10 0 0 1 10 10 V36 H0.5 V10.5 a10 10 0 0 1 10 -10 Z" class="bar"/>
  <line x1="0.5" y1="36" x2="859.5" y2="36" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="430" y="22.5" text-anchor="middle" class="mono ttl">ashwani@dubai: ~</text>

  <g class="mono">
    <text x="24" y="72"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text>
    <text x="24" y="98"><tspan class="c" font-weight="600">Ashwani Jha</tspan><tspan class="dim"> — Senior Software Engineer · Dubai, UAE</tspan></text>
    <text x="24" y="120" class="dim">distributed systems at scale · now building AI agent infrastructure</text>

    <text x="24" y="156"><tspan class="p">$</tspan> <tspan class="c">cat experience.log</tspan></text>
    <text x="124" y="182"><tspan class="acc">PropertyFinder</tspan><tspan x="276" class="c">Senior Software Engineer · Dubai</tspan></text>
    <text x="24" y="204"><tspan class="dim">2022–2025</tspan><tspan x="124" class="acc">Amazon</tspan><tspan x="276" class="c">SDE II · Just Walk Out · led 10 engineers</tspan></text>
    <text x="24" y="226"><tspan class="dim">2021–2022</tspan><tspan x="124" class="acc">Amazon Pay</tspan><tspan x="276" class="c">SDE · Alexa voice payments</tspan></text>
    <text x="24" y="248"><tspan class="dim">2019–2021</tspan><tspan x="124" class="acc">AWS</tspan><tspan x="276" class="c">Cloud Infrastructure Engineer · CloudFormation</tspan></text>

    <text x="24" y="284"><tspan class="p">$</tspan> <tspan class="c">grep -h impact *.log</tspan></text>
    <text x="24" y="310"><tspan class="key">3 days → 1 hour</tspan><tspan x="214" class="c">time to root cause, with an AI root-cause agent</tspan></text>
    <text x="24" y="332"><tspan class="key">−40% cost</tspan><tspan x="214" class="c">real-time anomaly detection across stores</tspan></text>
    <text x="24" y="354"><tspan class="key">−40% failures</tspan><tspan x="214" class="c">Amazon Pay transactions, latency fixes</tspan></text>

    <text x="24" y="386" class="p">$</text>
    <rect x="40" y="373" width="9" height="17" class="cur"/>
  </g>

  <!-- spark (original drawing, a nod to Claude) + tagline -->
