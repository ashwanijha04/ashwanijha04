<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="Mark3 — AI code reviewer. Reviews code on the Claude Agent SDK. Runs on your Claude plan — no API key to manage.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 366px 37px; }
    .edge { animation: edge 3.5s ease-in-out infinite alternate; }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes edge { from { opacity: .5; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot, .edge { animation: none; } }
  </style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c1121f" stop-opacity=".22"/><stop offset=".6" stop-color="#0d1117" stop-opacity="0"/>
  </linearGradient></defs>
  <rect x=".5" y=".5" width="439" height="209" rx="12" fill="#0d1117"/>
  <rect x=".5" y=".5" width="439" height="209" rx="12" fill="url(#g)"/>
  <rect class="edge" x=".5" y=".5" width="439" height="209" rx="12" fill="none" stroke="#c1121f" stroke-opacity=".55"/>
  <rect x="28" y="24" width="44" height="44" rx="10" fill="#c1121f"/>
  <text x="50" y="52.5" text-anchor="middle" class="m" font-size="17" font-weight="700" fill="#0d1117">M3</text>
  <text x="86" y="44" font-size="21" font-weight="700" fill="#f0f6fc">Mark3</text>
  <text x="86" y="64" font-size="13.5" fill="#c1121f">AI code reviewer</text>
  <rect x="336" y="25" width="80" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle class="dot" cx="349" cy="37" r="4" fill="#8b949e"/>
  <text x="358" y="41.5" class="m" font-size="11.5" fill="#c9d1d9">private</text>
  <text x="28" y="104" font-size="14.5" fill="#c9d1d9">Reviews code on the Claude Agent</text>
<text x="28" y="126" font-size="14.5" fill="#c9d1d9">SDK. Runs on your Claude plan —</text>
<text x="28" y="148" font-size="14.5" fill="#c9d1d9">no API key to manage.</text>
  <rect x="28" y="164" width="101" height="22" rx="11" fill="#c1121f" fill-opacity=".14" stroke="#c1121f" stroke-opacity=".45"/><text x="79" y="179" text-anchor="middle" font-size="12" fill="#e6edf3">code review</text><rect x="137.4" y="164" width="138" height="22" rx="11" fill="#c1121f" fill-opacity=".14" stroke="#c1121f" stroke-opacity=".45"/><text x="207" y="179" text-anchor="middle" font-size="12" fill="#e6edf3">Claude Agent SDK</text>
