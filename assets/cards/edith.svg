<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="Edith — Lightweight CRDT docs. Real-time docs on CRDTs, plus tasks and cycles, AI search, and an MCP server so agents can edit pages.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 366px 37px; }
    .edge { animation: edge 3.5s ease-in-out infinite alternate; }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes edge { from { opacity: .5; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot, .edge { animation: none; } }
  </style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2ea043" stop-opacity=".22"/><stop offset=".6" stop-color="#0d1117" stop-opacity="0"/>
  </linearGradient></defs>
