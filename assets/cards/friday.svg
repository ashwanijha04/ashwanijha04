<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Friday — Personal AI assistant. My always-on assistant, living in WhatsApp and Slack. Long-term memory, nightly memory consolidation, scheduled routines and real tools — the agent I use every day, and the proving ground for everything below.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 826px 37px; }
    .edge { animation: edge 3.5s ease-in-out infinite alternate; }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes edge { from { opacity: .5; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot, .edge { animation: none; } }
  </style>
